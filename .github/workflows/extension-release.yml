name: Release Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify version
        run: npm run verify:version
        env:
          TAG_VERSION: ${{ github.ref_name }}

      - name: Build extension
        run: npm run build

      - name: Check dist output
        run: |
          if [ ! -d dist ]; then
            echo "dist not found"
            exit 1
          fi
          echo "dist files:"
          ls -la dist

      - name: Package dist
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP_NAME="ts-swagger-extension-dist-${VERSION}.zip"
          LATEST_NAME="ts-swagger-extension-dist-latest.zip"
          cd dist
          zip -r "../${ZIP_NAME}" .
          cd ..
          cp "${ZIP_NAME}" "${LATEST_NAME}"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "LATEST_NAME=${LATEST_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extension/${{ env.ZIP_NAME }}
            extension/${{ env.LATEST_NAME }}
