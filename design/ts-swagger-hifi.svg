    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#15243d"/><stop offset="1" stop-color="#111d32"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#020611" flood-opacity=".55"/></filter>
    <style>
      text{font-family:Inter,"PingFang SC",sans-serif;fill:#e8eefc}.muted{fill:#8391aa}.soft{fill:#afbad0}.label{font-size:12px}.body{font-size:14px}.title{font-size:18px;font-weight:700}.mono{font-family:"SFMono-Regular",Consolas,monospace}.panel{fill:url(#card);stroke:#263957;stroke-width:1}.line{stroke:#263957;stroke-width:1}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="320" cy="-40" r="330" fill="#315ce5" opacity=".12"/><circle cx="1180" cy="120" r="280" fill="#8b5cf6" opacity=".09"/>
