  <circle cx="1264" cy="37" r="18" fill="#15253e"/><text x="1259" y="42" class="body">?</text><circle cx="1312" cy="37" r="18" fill="#15253e"/><text x="1307" y="42" class="body">⚙</text>
  <rect x="1342" y="18" width="74" height="38" rx="10" fill="#15253e"/><text x="1358" y="42" class="label soft">深色 ⌄</text>

  <rect x="16" y="88" width="300" height="796" rx="16" class="panel" filter="url(#shadow)"/>
  <text x="36" y="122" class="title">接口导航</text><rect x="257" y="104" width="40" height="24" rx="12" fill="#223653"/><text x="267" y="121" class="label soft">126</text>
  <rect x="34" y="142" width="264" height="40" rx="10" fill="#0f1b2f" stroke="#2a4165"/><text x="50" y="167" class="label muted">⌕  搜索接口、路径或标签</text><text x="266" y="167" class="label muted">⌘K</text>
  <text x="36" y="210" class="label muted">API 分组</text>
  <rect x="28" y="222" width="276" height="40" rx="10" fill="#192b47"/><text x="44" y="247" class="body">⌄　用户管理</text><text x="268" y="247" class="label muted">18</text>
  <rect x="38" y="270" width="256" height="56" rx="12" fill="#1d3354" stroke="#4272c7"/>
  <rect x="50" y="286" width="42" height="22" rx="6" fill="#163e36"/><text x="58" y="301" class="label" fill="#65e6b0">GET</text><text x="104" y="291" class="label">获取用户列表</text><text x="104" y="310" class="label muted mono">/api/users</text>
  <rect x="38" y="332" width="256" height="56" rx="12" fill="#111e34"/>
  <rect x="50" y="348" width="42" height="22" rx="6" fill="#3e2634"/><text x="54" y="363" class="label" fill="#ff91b8">POST</text><text x="104" y="353" class="label">创建用户</text><text x="104" y="372" class="label muted mono">/api/users/create</text>
  <rect x="28" y="402" width="276" height="40" rx="10" fill="#111e34"/><text x="44" y="427" class="body">›　订单管理</text><text x="268" y="427" class="label muted">32</text>
  <rect x="28" y="450" width="276" height="40" rx="10" fill="#111e34"/><text x="44" y="475" class="body">›　商品管理</text><text x="268" y="475" class="label muted">24</text>
  <rect x="28" y="498" width="276" height="40" rx="10" fill="#111e34"/><text x="44" y="523" class="body">›　权限管理</text><text x="268" y="523" class="label muted">16</text>
  <rect x="34" y="820" width="264" height="46" rx="12" fill="#101c30" stroke="#263957"/><circle cx="56" cy="843" r="6" fill="#43d19e"/><text x="72" y="840" class="label soft">代理扩展已连接</text><text x="72" y="856" class="label muted">Chrome · v0.3.0</text>

  <rect x="332" y="88" width="1092" height="796" rx="16" class="panel" filter="url(#shadow)"/>
  <rect x="332" y="88" width="1092" height="70" rx="16" fill="#121f35"/><text x="356" y="116" class="label muted">最近查看</text>
