  <rect x="504" y="124" width="170" height="28" rx="8" fill="#101c30"/><circle cx="518" cy="138" r="4" fill="#ff6b9c"/><text x="530" y="142" class="label soft">/users/create</text><text x="656" y="142" class="label muted">×</text>
  <text x="1350" y="142" class="label muted">2 个接口</text>

  <rect x="352" y="176" width="1052" height="214" rx="14" fill="#13223a" stroke="#29415f"/>
  <text x="376" y="204" class="label muted">用户管理　/　获取用户列表</text>
  <rect x="376" y="220" width="58" height="30" rx="8" fill="#154438"/><text x="389" y="240" class="label" fill="#6ce5b3" font-weight="700">GET</text>
  <text x="448" y="241" font-size="20" font-weight="700" class="mono">/api/users</text><text x="602" y="241" font-size="20" font-weight="700">获取用户列表</text>
  <text x="376" y="270" class="body soft">分页查询用户，可按状态、角色和关键词筛选。</text>
  <rect x="376" y="286" width="1004" height="40" rx="9" fill="#0d192b" stroke="#2a4165"/><text x="392" y="311" class="label soft mono">http://localhost:9966/api/users</text><rect x="1320" y="294" width="48" height="24" rx="7" fill="#1c3150"/><text x="1332" y="311" class="label">复制</text>
  <rect x="376" y="342" width="68" height="24" rx="12" fill="#1a2e4a"/><text x="390" y="359" class="label soft">参数 3</text><rect x="452" y="342" width="78" height="24" rx="12" fill="#1a2e4a"/><text x="466" y="359" class="label soft">请求体 无</text><rect x="538" y="342" width="82" height="24" rx="12" fill="#1a2e4a"/><text x="552" y="359" class="label soft">响应码 3</text><text x="1280" y="359" class="label" fill="#7aa7ff">展开详情　⌄</text>

  <rect x="352" y="406" width="1052" height="458" rx="14" fill="#0e192b" stroke="#263957"/>
  <rect x="352" y="406" width="1052" height="54" rx="14" fill="#13233b"/><text x="376" y="438" class="body" font-weight="700">TypeScript 类型</text>
  <rect x="512" y="418" width="112" height="30" rx="8" fill="#1e3555"/><text x="527" y="438" class="label">Query Params</text><text x="644" y="438" class="label muted">Request Body</text><text x="758" y="438" class="label muted">Response Data</text>
  <rect x="1246" y="418" width="68" height="30" rx="8" fill="#172b47"/><text x="1262" y="438" class="label soft">格式化</text><rect x="1322" y="418" width="64" height="30" rx="8" fill="url(#brand)"/><text x="1340" y="438" class="label" font-weight="700">复制</text>
  <rect x="370" y="480" width="1016" height="362" rx="10" fill="#091321"/>
  <text x="390" y="512" class="label muted mono">1</text><text x="426" y="512" class="body mono" fill="#c792ea">export type</text><text x="522" y="512" class="body mono" fill="#82aaff"> UserQuery</text><text x="616" y="512" class="body mono"> = {</text>
  <text x="390" y="544" class="label muted mono">2</text><text x="450" y="544" class="body mono" fill="#89ddff">keyword</text><text x="516" y="544" class="body mono">?: </text><text x="540" y="544" class="body mono" fill="#f78c6c">string</text>
  <text x="390" y="576" class="label muted mono">3</text><text x="450" y="576" class="body mono" fill="#89ddff">page</text><text x="486" y="576" class="body mono">?: </text><text x="510" y="576" class="body mono" fill="#f78c6c">number</text>
  <text x="390" y="608" class="label muted mono">4</text><text x="450" y="608" class="body mono" fill="#89ddff">pageSize</text><text x="516" y="608" class="body mono">?: </text><text x="540" y="608" class="body mono" fill="#f78c6c">number</text>
  <text x="390" y="640" class="label muted mono">5</text><text x="450" y="640" class="body mono" fill="#89ddff">status</text><text x="500" y="640" class="body mono">?: </text><text x="524" y="640" class="body mono" fill="#82aaff">UserStatus</text>
  <text x="390" y="672" class="label muted mono">6</text><text x="426" y="672" class="body mono">}</text>
  <line x1="414" y1="490" x2="414" y2="824" stroke="#182842"/>
  <rect x="1070" y="790" width="292" height="32" rx="8" fill="#101d31"/><text x="1086" y="811" class="label muted">⌘ C　复制当前类型到剪贴板</text>
